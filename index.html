<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<title>Windblown Logo Generator</title>

	<meta property="og:title" content="Windblown Logo Generator"/>
	<meta property="og:type" content="website"/>
	<meta property="og:url" content="https://windblown-logo-generator.vercel.app"/>
	<meta property="og:image" content="https://windblown-logo-generator.vercel.app/favicon.ico">

	<style>
		@font-face {
			font-family: 'LT Museum';
			src: url('LTMuseum-Medium.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Sofia Sans';
			src: url('SofiaSans-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Windblown Symbols';
			src: url('WindblownSymbols-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'ATC Krueger';
			src: url('ATCKrueger-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Berylium';
			src: url('Berylium-Regular.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Dosis';
			src: url('Dosis-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nova Flat';
			src: url('NovaFlat-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Adys';
			src: url('Adys-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Wingdings';
			src: url('Wingdings-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		body {
			font-family: sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			background-color: #0b0b28;
			color: white;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
		}
		canvas {
			max-width: 100%;
			border: 2px solid #333;
			background-color: #1a0b28;
			border-radius: 8px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.5);
		}
		.controls { 
			display: grid;
			grid-template-areas: 
				"top-row top-row"
				"left-col right-col";
			grid-template-columns: 1fr 1fr;
			gap: 20px; 
			margin: 20px 0;
			padding: 20px;
			background-color: #15154e;
			border-radius: 8px;
			box-shadow: 0 5px 15px rgba(0,0,0,0.5);
			box-sizing: border-box;
		}
		.top-row {
			grid-area: top-row;
		}
		.left-col {
			grid-area: left-col;
			display: flex;
			flex-direction: column;
			gap: 15px;
		}
		.right-col {
			grid-area: right-col;
			display: flex;
			flex-direction: column;
			gap: 15px;
			height: 100%;
		}
		.control-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
		}
		.control-group {
			display: flex;
			align-items: center;
			gap: 8px;
			flex: 1;
		}
		.on-the-bottom {
			margin-top: auto;
			display: flex;
			flex-direction: column;
			gap: 15px;
		}
		label {
			min-width: 60px;
		}
		.value-display {
			min-width: 30px;
			font-size: 14px;
			color: #888;
			font-weight: bold;
			text-align: left;
			cursor: default;
		}
		input[type="text"] {
			padding: 10px;
			font-size: 16px;
			border: none;
			border-radius: 4px;
			flex: 1;
		}
		input[type="color"] {
			border: none;
			width: 50px;
			height: 50px;
			border-radius: 4px;
			cursor: pointer;
			background: none;
		}
		input[type="range"] {
			flex: 1;
			accent-color: #3bd2d4;
			cursor: pointer;
		}
		input[type="number"] {
			flex: 1;
			padding: 5px;
			border-radius: 4px;
			border: none;
		}
		select {
			flex: 1;
			padding: 5px;
			border-radius: 4px;
			border: none;
			cursor: pointer;
		}
		button {
			font-size: 16px;
			padding: 10px 20px;
			background-color: #f544b8;
			border: none;
			border-radius: 4px;
			font-weight: bold;
			cursor: pointer;
		}
		button:hover {
			background-color: #cc328f;
		}
		.share-btn {
			font-size: 14px;
			padding: 7px 14px;
		}
		.updates-btn {
			background: none;
			color: #32154e;
			padding: 0 4px;
		}
		.credit {
			font-family: 'LT Museum';
			color: #32154e;
		}
		@media (max-width: 650px) {
			body {
				padding: 10px;
			}
			.controls {
				grid-template-areas: 
					"top-row"
					"left-col"
					"right-col";
				grid-template-columns: 1fr;
				gap: 15px; 
				margin: 15px 0;
				padding: 15px;
			}
		}
	</style>
</head>
<body>

	<canvas id="logoCanvas"></canvas>

	<div class="controls">
		<div class="top-row">
			<input type="text" id="logoText" value="WINDBLOWN" placeholder="Text goes here" style="width: 100%; box-sizing: border-box;">
		</div>



		<div class="left-col">
			<div class="control-row">
				<label>Glow:</label>
				<div class="control-group">
					<input type="color" id="glowColor" value="#5100ff">
					<input type="range" id="glowSize" min="0" max="100" step="1" value="20">
					<span id="valAlpha0" class="value-display">20</span>
				</div>
			</div>

			<div class="control-row">
				<label>Left:</label>
				<div class="control-group">
					<input type="color" id="color1" value="#1ddcff">
					<input type="range" id="alpha1" min="0" max="1" step="0.01" value="1">
					<span id="valAlpha1" class="value-display">0.95</span>
				</div>
			</div>

			<div class="control-row">
				<label>Right:</label>
				<div class="control-group">
					<input type="color" id="color2" value="#ff2dff">
					<input type="range" id="alpha2" min="0" max="1" step="0.01" value="1">
					<span id="valAlpha2" class="value-display">0.95</span>
				</div>
			</div>

			<div class="control-row">
				<label>Top:</label>
				<div class="control-group">
					<input type="color" id="color3" value="#ffffff">
					<input type="range" id="alpha3" min="0" max="1" step="0.01" value="1">
					<span id="valAlpha3" class="value-display">0.95</span>
				</div>
			</div>

			<div class="control-row">
				<label>Bottom:</label>
				<div class="control-group">
					<input type="color" id="color4" value="#b3ddf3">
					<input type="range" id="alpha4" min="0" max="1" step="0.01" value="1">
					<span id="valAlpha4" class="value-display">0.95</span>
				</div>
			</div>
		</div>



		<div class="right-col">
			<div class="control-row">
				<label>Font:</label>
				<select id="fontChooser">
					<optgroup label="Windblown fonts">
						<option value="LT Museum" selected>LT Museum</option>
						<option value="Sofia Sans">Sofia Sans</option>
						<option value="Windblown Symbols">Windblown Symbols (0-9)</option>
					</optgroup>
					<optgroup label="Dead Cells fonts">
						<option value="ATC Krueger">ATC Krueger</option>
						<option value="Berylium">Berylium</option>
						<option value="Dosis">Dosis</option>
						<option value="Nova Flat">Nova Flat</option>
						<option value="Adys">Adys</option>
					</optgroup>
					<optgroup label="Other fonts">
						<option value="Arial">Arial</option>
						<option value="Times New Roman">Times New Roman</option>
						<option value="Courier New">Courier New</option>
						<option value="Impact">Impact</option>
						<option value="Wingdings">Wingdings</option>
					</optgroup>
				</select>
			</div>

			<div class="control-row">
				<label>Style:</label>
				<select id="styleChooser">
					<option value="normal">Normal</option>
					<option value="bold">Bold</option>
					<option value="italic">Italic</option>
					<option value="bold italic">Bold Italic</option>
				</select>
			</div>

			<div class="control-row">
				<label>Gap:</label>
				<input type="number" id="offset" placeholder="Number (default = 2)" class="scale-input" min="-300" max="300" value="2">
			</div>

			<div class="control-row"">
				<button id="copyLinkBtn" class="share-btn" style="width: 100%;">Share Current Settings</button>
			</div>

			<div style="height: 5px;"></div>

			<div class="on-the-bottom">
				<div class="control-row">
					<label for="exportScale">Export scale:</label>
					<input type="number" id="exportScale" placeholder="Number (default = 4)" class="scale-input" min="0" max="10" value="4">
				</div>
				<button id="downloadBtn">Export as .png</button>
			</div>
		</div>
	</div>

	<div class="credit">
		<label>Made by emoman</label>
	</div>

	<script>
		const canvas = document.getElementById('logoCanvas');
		const ctx = canvas.getContext('2d');
		const copyLinkBtn = document.getElementById('copyLinkBtn');
		const downloadBtn = document.getElementById('downloadBtn');
		const exportScaleInput = document.getElementById('exportScale');

		const textInput = document.getElementById('logoText');
		const fontInput = document.getElementById('fontChooser');
		const styleInput = document.getElementById('styleChooser');
		const offsetInput = document.getElementById('offset');
		const glowColorInput = document.getElementById('glowColor');
		const glowSizeInput = document.getElementById('glowSize');
		const color1Input = document.getElementById('color1');
		const alpha1Input = document.getElementById('alpha1');
		const color2Input = document.getElementById('color2');
		const alpha2Input = document.getElementById('alpha2');
		const color3Input = document.getElementById('color3');
		const alpha3Input = document.getElementById('alpha3');
		const color4Input = document.getElementById('color4');
		const alpha4Input = document.getElementById('alpha4');

		const valAlpha0 = document.getElementById('valAlpha0');
		const valAlpha1 = document.getElementById('valAlpha1');
		const valAlpha2 = document.getElementById('valAlpha2');
		const valAlpha3 = document.getElementById('valAlpha3');
		const valAlpha4 = document.getElementById('valAlpha4');

		function updateValueDisplays() {
			document.getElementById('valAlpha0').textContent = glowSizeInput.value;
			document.getElementById('valAlpha1').textContent = alpha1Input.value;
			document.getElementById('valAlpha2').textContent = alpha2Input.value;
			document.getElementById('valAlpha3').textContent = alpha3Input.value;
			document.getElementById('valAlpha4').textContent = alpha4Input.value;
		}

		function hexToRgba(hex, alpha) {
			const r = parseInt(hex.slice(1, 3), 16);
			const g = parseInt(hex.slice(3, 5), 16);
			const b = parseInt(hex.slice(5, 7), 16);
			return `rgba(${r}, ${g}, ${b}, ${alpha})`;
		}

		function renderLogo(targetCanvas, targetCtx, text, scale = 1) {
			const fontSize = 64 * scale;
			const offset = offsetInput.value * scale;
			const glowSize = glowSizeInput.value * scale;
			const paddingXY = (20 * scale) + glowSize*1.5;
			const selectedFont = fontInput.value;
			const selectedStyle = styleInput.value;

			// Calculating canvas sizes
			targetCtx.font = `${selectedStyle} ${fontSize}px ${selectedFont}`;
			const textWidth = targetCtx.measureText(text).width;

			targetCanvas.width = textWidth + paddingXY;
			targetCanvas.height = fontSize + paddingXY;

			targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

			let x = targetCanvas.width / 2;
			const y = targetCanvas.height / 2;

			const isItalic = selectedStyle.includes("italic");
			if (isItalic) {
				x -= fontSize * 0.09; 
			}

			// Text style
			targetCtx.font = `${selectedStyle} ${fontSize}px ${selectedFont}`;
			targetCtx.textAlign = 'center';
			targetCtx.textBaseline = 'middle';

			// Colors
			const glowColor = glowColorInput.value;
			const rgba1 = hexToRgba(color1Input.value, alpha1Input.value);
			const rgba2 = hexToRgba(color2Input.value, alpha2Input.value);
			const rgba3 = hexToRgba(color3Input.value, alpha3Input.value);
			const rgba4 = hexToRgba(color4Input.value, alpha4Input.value);

			// Glow
			if (glowSize > 0) {
				targetCtx.save();
				const shadowOffsetX = 10000 * scale;
				targetCtx.shadowOffsetX = shadowOffsetX;
				targetCtx.shadowOffsetY = 0;
				targetCtx.shadowColor = glowColor;
				targetCtx.shadowBlur = glowSize;
				targetCtx.fillText(text, x - shadowOffsetX, y);

				targetCtx.shadowBlur = glowSize * 0.4;
				targetCtx.fillText(text, x - shadowOffsetX, y);
				targetCtx.restore();
			}

			targetCtx.shadowBlur = 0;
			targetCtx.shadowOffsetX = 0;
			targetCtx.shadowOffsetY = 0;

			// Blue layer
			targetCtx.fillStyle = rgba1;
			targetCtx.fillText(text, x - offset, y);

			// Pink layer
			targetCtx.fillStyle = rgba2;
			targetCtx.fillText(text, x + offset, y);

			// White-gray layer
			const gradient = targetCtx.createLinearGradient(x, y - fontSize/2, x, y + fontSize/2);
			gradient.addColorStop(0, rgba3);
			gradient.addColorStop(0.3, rgba3);
			gradient.addColorStop(0.9, rgba4);
			gradient.addColorStop(1, rgba4);
			targetCtx.fillStyle = gradient;
			targetCtx.fillText(text, x, y);
		}

		function drawLogo() {
			updateValueDisplays();
			renderLogo(canvas, ctx, textInput.value, 1);
		}

		document.fonts.addEventListener('loadingdone', () => {
			drawLogo();
		});

		const inputs = [textInput, fontInput, styleInput, offsetInput, glowColorInput, glowSizeInput, color1Input, alpha1Input, color2Input, alpha2Input, color3Input, alpha3Input, color4Input, alpha4Input];
		inputs.forEach(input => input.addEventListener('input', drawLogo));

		exportScaleInput.addEventListener('change', function() {
			let val = parseFloat(exportScaleInput.value);
			const clampedVal = Math.max(0.01, Math.min(val, 10));
			exportScaleInput.value = clampedVal;
		});

		downloadBtn.addEventListener('click', function() {
			const exportCanvas = document.createElement('canvas');
			const exportCtx = exportCanvas.getContext('2d');
			let exportScale = parseFloat(exportScaleInput.value) || 4;
			exportScale = Math.max(0.01, Math.min(exportScale, 10));
			renderLogo(exportCanvas, exportCtx, textInput.value, exportScale);
			const dataURL = exportCanvas.toDataURL('image/png');
			const link = document.createElement('a');
			link.href = dataURL;
			link.download = 'custom-logo.png';
			document.body.appendChild(link);
			link.click();
			document.body.removeChild(link);
		});

		function loadSettingsFromUrl() {
			const params = new URLSearchParams(window.location.search);
			if (params.has('text')) textInput.value = params.get('text');
			if (params.has('font')) fontInput.value = params.get('font');
			if (params.has('style')) styleInput.value = params.get('style');
			if (params.has('offset')) offsetInput.value = params.get('offset');
			if (params.has('gc')) glowColorInput.value = params.get('gc');
			if (params.has('gs')) glowSizeInput.value = params.get('gs');
			if (params.has('c1')) color1Input.value = params.get('c1');
			if (params.has('a1')) alpha1Input.value = params.get('a1');
			if (params.has('c2')) color2Input.value = params.get('c2');
			if (params.has('a2')) alpha2Input.value = params.get('a2');
			if (params.has('c3')) color3Input.value = params.get('c3');
			if (params.has('a3')) alpha3Input.value = params.get('a3');
			if (params.has('c4')) color4Input.value = params.get('c4');
			if (params.has('a4')) alpha4Input.value = params.get('a4');
		}

		copyLinkBtn.addEventListener('click', function() {
			const params = new URLSearchParams();
			params.set('text', textInput.value);
			params.set('font', fontInput.value);
			params.set('style', styleInput.value);
			params.set('offset', offsetInput.value);
			params.set('gc', glowColorInput.value);
			params.set('gs', glowSizeInput.value);
			params.set('c1', color1Input.value);
			params.set('a1', alpha1Input.value);
			params.set('c2', color2Input.value);
			params.set('a2', alpha2Input.value);
			params.set('c3', color3Input.value);
			params.set('a3', alpha3Input.value);
			params.set('c4', color4Input.value);
			params.set('a4', alpha4Input.value);

			const shareUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
			
			navigator.clipboard.writeText(shareUrl).then(() => {
				const originalText = copyLinkBtn.textContent;
				copyLinkBtn.textContent = 'Copied link!';
				setTimeout(() => copyLinkBtn.textContent = originalText, 2000);
			}).catch(err => {
				alert('Could not copy link automatically. Here it is:\n' + shareUrl);
			});
		});

		window.addEventListener('DOMContentLoaded', () => {
			loadSettingsFromUrl();
			drawLogo();
			window.history.replaceState({}, document.title, window.location.pathname);
		});
	</script>
</body>
</html>
